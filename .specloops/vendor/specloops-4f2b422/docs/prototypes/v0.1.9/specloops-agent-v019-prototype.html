<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Clickable SpecLoops Agent interface prototype using fictional project data.">
  <title>SpecLoops Agent - Interactive Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2ed;
      --paper: #fbfcf8;
      --paper-2: #f4f6f1;
      --paper-3: #e5ebe4;
      --ink: #17352d;
      --muted: #64736d;
      --faint: #89968f;
      --line: #d7ded7;
      --accent: #2f6d57;
      --accent-strong: #225642;
      --accent-soft: #dbeae1;
      --danger: #a5453d;
      --danger-soft: #f4dedb;
      --warning: #94651b;
      --warning-soft: #f2e8d1;
      --info: #426779;
      --info-soft: #dce8ed;
      --shadow: 0 18px 52px rgba(32, 57, 47, .09);
      --radius: 18px;
      --radius-sm: 11px;
      --sidebar: 252px;
      --header: 72px;
      --font: "Avenir Next", Avenir, "SF Pro Display", "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101713;
      --paper: #18211d;
      --paper-2: #1e2924;
      --paper-3: #27352f;
      --ink: #eef5f0;
      --muted: #a5b4ac;
      --faint: #798a81;
      --line: #32433b;
      --accent: #7eb59a;
      --accent-strong: #9dc7b1;
      --accent-soft: #263f34;
      --danger: #ed988e;
      --danger-soft: #442b29;
      --warning: #e7bf72;
      --warning-soft: #463a25;
      --info: #90bacb;
      --info-soft: #263b44;
      --shadow: 0 18px 52px rgba(0, 0, 0, .24);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 82% 10%, color-mix(in srgb, var(--accent-soft) 68%, transparent) 0, transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button, [data-route], [data-action], [data-tab] { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1.02; letter-spacing: -.045em; margin-bottom: 16px; }
    h2 { font-size: clamp(1.45rem, 2.5vw, 2rem); line-height: 1.12; letter-spacing: -.03em; margin-bottom: 12px; }
    h3 { font-size: 1.02rem; line-height: 1.25; letter-spacing: -.01em; margin-bottom: 8px; }
    p { color: var(--muted); margin-bottom: 16px; }
    small { color: var(--muted); }

    .skip-link { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: var(--radius-sm); }
    .skip-link:focus { top: 12px; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 72%, white); outline-offset: 3px; }

    .app-shell { min-height: 100dvh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: var(--sidebar);
      padding: 18px 14px;
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 8px 10px 14px; cursor: pointer; border-radius: var(--radius-sm); }
    .brand:hover { background: var(--paper-2); }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 800; letter-spacing: -.05em; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--paper) 12%, transparent); }
    .brand strong { display: block; letter-spacing: -.02em; }
    .brand small { display: block; font-size: 11px; }
    .project-switcher { border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; text-align: left; cursor: pointer; }
    .project-switcher:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); transform: translateY(-1px); }
    .project-switcher span { display: block; font-size: 11px; color: var(--muted); }
    .project-switcher strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-group { display: grid; gap: 4px; }
    .nav-label { padding: 8px 12px 5px; color: var(--faint); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--muted); text-align: left; cursor: pointer; transition: .18s ease; }
    .nav-item:hover { background: var(--paper-2); color: var(--ink); transform: translateX(2px); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }
    .nav-icon { width: 25px; height: 25px; border: 1px solid currentColor; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 800; opacity: .84; }
    .sidebar-foot { margin-top: auto; display: grid; gap: 8px; }
    .prototype-note { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--paper-2); color: var(--muted); font-size: 12px; }

    .workspace { grid-column: 2; min-width: 0; }
    .topbar { height: var(--header); position: sticky; top: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 28px; background: color-mix(in srgb, var(--bg) 83%, transparent); backdrop-filter: blur(18px); border-bottom: 1px solid color-mix(in srgb, var(--line) 74%, transparent); }
    .crumbs { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--muted); font-size: 13px; }
    .crumbs strong { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .content { width: min(1320px, 100%); margin: 0 auto; padding: 34px 34px 100px; }
    .page-enter { animation: rise .34s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 28px; }
    .page-head p { max-width: 720px; margin-bottom: 0; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .eyebrow { color: var(--accent-strong); font-size: 12px; font-weight: 780; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 10px; }
    .lede { font-size: 1.08rem; line-height: 1.62; }

    .btn { min-height: 42px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius-sm); padding: 0 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; cursor: pointer; transition: transform .16s ease, background .16s ease, border-color .16s ease; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 56%, var(--line)); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn-primary { background: var(--accent-strong); color: #f7fbf8; border-color: var(--accent-strong); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 22%, transparent); }
    .btn-primary:hover { background: var(--accent); border-color: var(--accent); }
    .btn-soft { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
    .btn-ghost { background: transparent; }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
    .btn-sm { min-height: 34px; padding: 0 11px; font-size: 13px; }
    .icon-btn { width: 42px; padding: 0; }

    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-asym { grid-template-columns: minmax(0, 1.6fr) minmax(300px, .8fr); }
    .span-2 { grid-column: span 2; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 1px 0 color-mix(in srgb, var(--paper) 70%, transparent); }
    .card.clickable { cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .card.clickable:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .card.tinted { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 18%, var(--line)); }
    .card.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 18%, var(--line)); }
    .card.warning { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 16%, var(--line)); }
    .card.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 16%, var(--line)); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .card p:last-child { margin-bottom: 0; }
    .label { color: var(--muted); font-size: 12px; font-weight: 740; }
    .metric { font-size: 2rem; line-height: 1; letter-spacing: -.05em; font-weight: 800; margin: 6px 0 10px; }
    .metric.small { font-size: 1.45rem; }
    .mini-metric { display: grid; gap: 3px; }
    .mini-metric strong { font-size: 1.1rem; }
    .status { display: inline-flex; align-items: center; min-height: 26px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--paper-3); color: var(--muted); white-space: nowrap; }
    .status.good { background: var(--accent-soft); color: var(--accent-strong); }
    .status.attn { background: var(--warning-soft); color: var(--warning); }
    .status.bad { background: var(--danger-soft); color: var(--danger); }
    .status.info { background: var(--info-soft); color: var(--info); }
    .status.neutral { background: var(--paper-3); color: var(--muted); }

    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 14px; }
    .section-title h2, .section-title h3 { margin: 0; }
    .attention-list { display: grid; gap: 10px; }
    .attention-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--radius-sm); background: var(--paper-2); cursor: pointer; }
    .attention-row:hover { background: var(--paper-3); }
    .kind { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--paper); border: 1px solid var(--line); font-size: 11px; font-weight: 800; color: var(--accent-strong); }
    .attention-row strong { display: block; }
    .attention-row small { display: block; }
    .arrow { color: var(--faint); font-size: 20px; }

    .progress-line { height: 7px; background: var(--paper-3); overflow: hidden; border-radius: 999px; }
    .progress-line > span { display: block; height: 100%; width: var(--value, 50%); background: var(--accent); border-radius: inherit; transition: width .35s ease; }
    .journey { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .journey-step { padding: 11px; border-radius: var(--radius-sm); background: var(--paper-2); color: var(--muted); font-size: 12px; font-weight: 700; }
    .journey-step.done { background: var(--accent-soft); color: var(--accent-strong); }
    .journey-step.current { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent-strong); }

    .domain-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .domain-card { min-height: 162px; display: flex; flex-direction: column; justify-content: space-between; }
    .domain-top { display: flex; justify-content: space-between; gap: 12px; }
    .domain-counts { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
    .domain-counts b { color: var(--ink); }

    .tabs { display: flex; gap: 5px; flex-wrap: wrap; padding: 5px; border-radius: 13px; background: var(--paper-2); width: fit-content; margin-bottom: 18px; }
    .tab { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 9px; font-weight: 700; cursor: pointer; }
    .tab:hover { color: var(--ink); }
    .tab.active { background: var(--paper); color: var(--ink); box-shadow: 0 2px 12px rgba(36, 55, 47, .08); }

    .timeline { position: relative; padding-left: 26px; }
    .timeline:before { content: ""; position: absolute; left: 7px; top: 5px; bottom: 8px; width: 1px; background: var(--line); }
    .timeline-item { position: relative; padding: 0 0 23px 13px; }
    .timeline-item:before { content: ""; position: absolute; left: -23px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 3px solid var(--accent); }
    .timeline-item time { color: var(--faint); font-size: 12px; }

    .object-row { display: grid; grid-template-columns: minmax(0, 1.7fr) .8fr .75fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .object-row:last-child { border-bottom: 0; }
    .object-row strong { display: block; }
    .object-row small { display: block; }

    .wizard-shell { min-height: 100dvh; display: grid; grid-template-columns: minmax(280px, .7fr) minmax(0, 1.3fr); }
    .wizard-aside { position: sticky; top: 0; height: 100dvh; padding: 38px; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .wizard-aside:after { content: ""; position: absolute; width: 390px; height: 390px; right: -170px; bottom: -150px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 52%, transparent); filter: blur(1px); }
    .wizard-aside .brand { width: fit-content; color: var(--paper); padding-left: 0; }
    .wizard-aside .brand:hover { background: transparent; }
    .wizard-aside h1 { max-width: 540px; position: relative; z-index: 1; }
    .wizard-aside p { color: color-mix(in srgb, var(--paper) 72%, transparent); max-width: 52ch; position: relative; z-index: 1; }
    .wizard-main { min-height: 100dvh; display: grid; place-items: center; padding: 38px; }
    .wizard-panel { width: min(760px, 100%); }
    .choice-grid { display: grid; gap: 12px; }
    .choice { display: grid; grid-template-columns: 45px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 17px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; text-align: left; }
    .choice:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
    .choice.selected { border-color: var(--accent); background: var(--accent-soft); }
    .choice-number { width: 42px; height: 42px; border-radius: 12px; background: var(--paper-2); display: grid; place-items: center; font-weight: 800; color: var(--accent-strong); }
    .choice strong { display: block; }
    .choice small { display: block; margin-top: 3px; }
    .wizard-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .stepper { display: flex; gap: 8px; margin-bottom: 24px; }
    .stepper span { height: 6px; flex: 1; border-radius: 999px; background: var(--paper-3); }
    .stepper span.done { background: var(--accent); }

    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    .field label { font-size: 13px; font-weight: 760; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: var(--radius-sm); padding: 12px 13px; }
    .field textarea { min-height: 112px; resize: vertical; }
    .field .help { font-size: 12px; color: var(--muted); }

    .chat-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .75fr); gap: 16px; }
    .conversation { min-height: 560px; display: flex; flex-direction: column; }
    .chat-feed { display: grid; gap: 14px; flex: 1; }
    .message { max-width: 84%; padding: 14px 16px; border-radius: 16px; background: var(--paper-2); }
    .message.agent { border-top-left-radius: 5px; }
    .message.human { margin-left: auto; background: var(--accent-soft); border-top-right-radius: 5px; }
    .message p:last-child { margin-bottom: 0; color: var(--ink); }
    .decision-options { display: grid; gap: 9px; margin-top: 14px; }
    .decision-option { display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; }
    .decision-option:hover, .decision-option.selected { border-color: var(--accent); background: var(--accent-soft); }
    .decision-option strong, .decision-option small { display: block; text-align: left; }
    .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--faint); margin-top: 2px; flex: 0 0 auto; }
    .selected .radio { border: 5px solid var(--accent); background: var(--paper); }
    .composer { display: flex; gap: 8px; margin-top: 16px; }
    .composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: var(--radius-sm); padding: 11px 13px; }
    .boundary { padding: 12px 14px; background: var(--paper-2); border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13px; color: var(--muted); }

    .revision-paper { max-width: 940px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .revision-head { padding: 24px 28px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; }
    .revision-body { padding: 28px; }
    .revision-body h3 { margin-top: 25px; }
    .spec-block { padding: 16px; background: var(--paper-2); border-radius: var(--radius-sm); margin: 12px 0; }
    .approval-bar { position: sticky; bottom: 14px; margin: 22px auto 0; max-width: 940px; padding: 12px 14px; background: color-mix(in srgb, var(--paper) 94%, transparent); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .flow-map { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .flow-node { min-width: 122px; padding: 12px; border-radius: var(--radius-sm); background: var(--paper-2); border: 1px solid var(--line); }
    .flow-node.active { background: var(--accent-soft); border-color: var(--accent); }
    .flow-node strong { display: block; font-size: 13px; }
    .flow-node small { display: block; margin-top: 4px; }

    .proof-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .proof-card { padding: 17px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--paper); }
    .proof-card h3 { display: flex; justify-content: space-between; gap: 10px; }
    .evidence-list { display: grid; gap: 8px; margin-top: 13px; }
    .evidence-item { padding: 10px 11px; border-radius: 10px; background: var(--paper-2); display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }

    .role-card { min-height: 210px; display: flex; flex-direction: column; }
    .role-card .btn { margin-top: auto; align-self: flex-start; }
    .avatar { width: 46px; height: 46px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-weight: 850; letter-spacing: -.04em; }

    .mobile-top, .mobile-nav, .mobile-menu { display: none; }
    .toast { position: fixed; z-index: 80; right: 22px; bottom: 22px; max-width: 360px; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--ink); color: var(--paper); box-shadow: var(--shadow); transform: translateY(18px); opacity: 0; pointer-events: none; transition: .22s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 60; padding: 24px; background: rgba(11, 20, 16, .56); display: grid; place-items: center; backdrop-filter: blur(5px); }
    .modal { width: min(560px, 100%); max-height: calc(100dvh - 48px); overflow: auto; background: var(--paper); border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 24px; }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .empty-state { text-align: center; padding: 54px 22px; background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius); }

    @media (max-width: 1080px) {
      :root { --sidebar: 218px; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .domain-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .proof-grid { grid-template-columns: 1fr; }
      .chat-layout { grid-template-columns: 1fr; }
      .chat-layout > aside { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    }

    @media (max-width: 820px) {
      body { padding-bottom: 72px; }
      .app-shell { display: block; }
      .sidebar, .topbar { display: none; }
      .workspace { display: block; }
      .mobile-top { height: 62px; position: sticky; top: 0; z-index: 18; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: color-mix(in srgb, var(--bg) 86%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(18px); }
      .mobile-top .brand { padding: 0; }
      .mobile-top .brand small { display: none; }
      .mobile-nav { display: grid; position: fixed; z-index: 30; inset: auto 10px 10px; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px; background: color-mix(in srgb, var(--paper) 94%, transparent); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(18px); }
      .mobile-nav button { min-height: 47px; border: 0; background: transparent; color: var(--muted); border-radius: 11px; font-size: 11px; font-weight: 750; cursor: pointer; }
      .mobile-nav button.active { background: var(--accent-soft); color: var(--accent-strong); }
      .mobile-menu { position: fixed; z-index: 31; left: 10px; right: 10px; bottom: 73px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow); }
      .mobile-menu.show { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .content { padding: 24px 16px 90px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .page-actions { justify-content: flex-start; }
      .grid-2, .grid-3, .grid-4, .grid-asym, .domain-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .wizard-shell { display: block; }
      .wizard-aside { position: relative; height: auto; min-height: 300px; padding: 26px 22px; }
      .wizard-aside h1 { font-size: 2.15rem; }
      .wizard-main { min-height: 0; padding: 30px 16px 94px; place-items: start stretch; }
      .choice { grid-template-columns: 40px minmax(0, 1fr); }
      .choice .arrow { display: none; }
      .journey { grid-template-columns: 1fr; }
      .object-row { grid-template-columns: 1fr auto; }
      .object-row > :nth-child(2), .object-row > :nth-child(3) { display: none; }
      .chat-layout > aside { display: grid; grid-template-columns: 1fr; }
      .message { max-width: 94%; }
      .revision-head, .approval-bar { align-items: flex-start; flex-direction: column; }
      .revision-body { padding: 20px; }
      .approval-bar { bottom: 82px; }
    }

    /* Feedback revision: calmer rhythm, in-place guidance, meaningful domain maps. */
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    .metric, .usage-table { font-variant-numeric: tabular-nums; }
    .section-title { margin-top: 38px; margin-bottom: 20px; flex-wrap: wrap; }
    .section-divider { border-top: 1px dashed var(--line); padding-top: 32px; margin-top: 38px; }
    .card-head { flex-wrap: wrap; }
    .card-head > div { min-width: 0; }
    .card, .proof-card { min-width: 0; }
    .card > p { max-width: 65ch; }
    .chat-layout > aside { display: grid; align-content: start; gap: 18px; }
    .composer { flex-wrap: wrap; }
    .composer input { flex-basis: 100%; }
    .btn { white-space: normal; text-align: center; padding-top: 8px; padding-bottom: 8px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .sidebar { overflow-y: auto; }
    [data-theme="dark"] .btn-primary { color: #122d23; }
    .section-intro { max-width: 65ch; }
    .campaign-grid { gap: 22px; }
    .campaign-grid .card { padding: 26px; }
    .campaign-grid .card-head { min-height: 38px; }
    .summary-card { padding: clamp(24px, 3vw, 38px); }
    .summary-card h2 { max-width: 26ch; font-size: clamp(1.6rem, 2.7vw, 2.3rem); margin: 14px 0 18px; }
    .summary-footer { display: flex; flex-wrap: wrap; gap: 12px 22px; padding-top: 22px; margin-top: 24px; border-top: 1px solid var(--line); }
    .next-card { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 28px; }
    .next-card .btn { margin-top: auto; }
    .help-pair { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
    .help-pair > .btn { min-width: 0; }
    .help-button { display: inline-grid; place-items: center; vertical-align: middle; flex: 0 0 auto; width: 26px; height: 26px; padding: 0; border: 0; background: transparent; cursor: help; color: var(--muted); border-radius: 50%; }
    .help-button span { border: 1px solid currentColor; border-radius: 50%; font: 600 12px Georgia, serif; width: 16px; height: 16px; line-height: 15px; }
    .help-button:hover, .help-button[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent-strong); }
    #context-help { position: fixed; z-index: 95; width: min(310px, calc(100vw - 24px)); padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow); font-size: 13px; line-height: 1.55; }
    #context-help strong { display: block; margin-bottom: 5px; }
    .theme-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .drawer-backdrop { padding: 0; place-items: stretch end; }
    .drawer { width: min(510px, 100%); height: 100dvh; max-height: 100dvh; border-radius: 22px 0 0 22px; padding: 30px; animation: rise .24s ease; }
    .drawer .attention-row { margin: 18px 0; padding: 18px; border: 1px solid var(--line); }
    .drawer .attention-row small { margin-top: 7px; }
    .drawer .attention-row .kind { align-self: start; }
    .domain-map { padding: 28px; background-image: radial-gradient(var(--line) .7px, transparent .7px); background-size: 18px 18px; }
    .map-root { display: block; width: min(400px,100%); margin: 16px auto 26px; padding: 20px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; text-align: center; }
    .map-root strong { display: block; font-size: 20px; }
    .map-branches { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 22px; position: relative; padding-top: 22px; border-top: 1px solid var(--accent); }
    .map-branch { position: relative; }
    .map-branch:before { content: ''; height: 22px; width: 1px; background: var(--accent); position: absolute; top: -22px; left: 50%; }
    .map-branch h3 { padding: 12px; text-align: center; background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; }
    .map-object { width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; margin: 12px 0; padding: 17px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    .map-object:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .map-object .status { align-self: flex-start; white-space: normal; }
    .map-object small { line-height: 1.5; }
    .map-journey { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 20px; counter-reset: journey; }
    .map-journey .map-object { min-height: 190px; margin: 0; counter-increment: journey; }
    .map-journey .map-object:before { content: '0' counter(journey) ' →'; color: var(--accent-strong); font-size: 12px; font-weight: 750; }
    .domain-context { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(220px,1fr); gap: 28px; margin: 24px 0; }
    .context-facts { display: grid; gap: 12px; }
    .context-facts p { margin: 0; }
    .loop-strip { margin: 24px 0 0; padding: 18px 0 0; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
    .gap-facts { margin: 24px 0; gap: 20px; }
    .gap-actions { border-top: 1px dashed var(--line); padding-top: 24px; margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; }
    .gap-actions .btn { flex: 1 1 170px; }
    .gap-comparison .spec-block { padding: 22px; margin: 0; }
    .gap-comparison p { margin-top: 10px; }
    .usage-table-wrap { overflow-x: auto; }
    .usage-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    .usage-table th { color: var(--muted); font-size: 12px; font-weight: 700; }
    .usage-table th, .usage-table td { padding: 18px 12px; border-bottom: 1px solid var(--line); }
    .usage-table td:first-child, .usage-table th:first-child { padding-left: 0; }
    .usage-table td small { display: block; }
    .usage-table .numeric { text-align: right; white-space: nowrap; }
    .usage-table tfoot { font-weight: 750; }
    .connection-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .connection-row p { margin: 6px 0 0; }
    .sample-note { font-size: 13px; color: var(--muted); margin: 18px 0; }
    .setting-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; }
    .setting-row p { margin-bottom: 0; }
    .role-card { gap: 12px; }
    .role-card .card-head, .role-card h2, .role-card p { margin-bottom: 0; }
    .role-card .btn { margin-top: 8px; }
    .modal-actions { flex-wrap: wrap; }
    @media (max-width: 1120px) {
      .grid-asym { grid-template-columns: minmax(0, 1fr); }
      .map-branches, .map-journey { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .page-head { align-items: flex-start; flex-direction: column; }
      .page-actions { justify-content: flex-start; }
    }
    @media (max-width: 820px) {
      .map-branches, .map-journey, .domain-context { grid-template-columns: 1fr; }
      .domain-map { padding: 20px; }
      .map-branches { gap: 28px; }
      .drawer { border-radius: 0; padding: 24px 20px; }
      .drawer .attention-row { padding: 14px; }
      .help-button { width: 32px; height: 32px; }
      .toast { bottom: 88px; left: 16px; right: 16px; }
      .card-head { gap: 12px; }
      .connection-row { flex-wrap: wrap; }
      .section-title { align-items: flex-start; }
      .approval-bar { position: static; }
      .usage-table { min-width: 620px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="context-help" role="tooltip" hidden></div>

  <script>
    // All project content in this prototype is fictional sample data.
    const state = {
      route: 'home',
      previousRoute: 'home',
      theme: localStorage.getItem('sl-theme') || 'light',
      mobileMenu: false,
      wizardStep: 0,
      startPath: 'start',
      sessionChoice: 'founder',
      themeChoice: 'session-zero',
      secondaryCampaigns: ['security-review'],
      decisionChoice: '',
      decisionCaptured: false,
      checkpointState: 'ready',
      revisionTab: 'summary',
      revisionApproved: false,
      assignmentSent: false,
      receiptAvailable: false,
      adapter: 'github',
      buildTab: 'assignment',
      receiptTab: 'overview',
      atlasDomain: 'Product',
      atlasTab: 'objects',
      specialist: 'Verifier',
      specialistTab: 'brief',
      historyFilter: 'all',
      evidenceFilter: 'all',
      modal: null,
      helpEnabled: true,
      efficiencyTab: 'human',
      usagePeriod: 'month',
      receiptOutcome: 'review',
      gapOutcome: 'review',
      activity: []
    };

    document.documentElement.dataset.theme = state.theme;

    const project = {
      name: 'Northstar Care',
      short: 'NC',
      primaryCampaign: 'MVP Build',
      quest: 'Patient onboarding',
      revision: 'MVP Definition R3',
      owner: 'Maya Alvarez',
      repository: 'northstar-care/app'
    };

    const nav = [
      ['home', 'HM', 'Home'],
      ['product-room', 'PR', 'Product Room'],
      ['atlas', 'AT', 'Project Atlas'],
      ['build', 'BL', 'Build'],
      ['briefing', 'BR', 'Briefing']
    ];

    const moreNav = [
      ['campaigns', 'Campaigns'],
      ['specialists', 'Specialists'],
      ['gaps', 'Gaps and evidence'],
      ['history', 'History'],
      ['efficiency', 'Efficiency'],
      ['settings', 'Settings']
    ];

    const routeTitles = {
      home: 'Home', onboarding: 'Choose a path', 'onboarding-start': 'Start new', 'onboarding-resume': 'Resume existing', 'onboarding-invite': 'Join a project',
      'session-zero': 'Session Zero', campaigns: 'Campaigns', atlas: 'Project Atlas', 'atlas-domain': 'Atlas domain',
      'product-room': 'Product Room', checkpoint: 'Draft checkpoint', revision: 'Exact revision review', approval: 'Approval recorded',
      build: 'Build', 'build-assignment': 'Build Assignment', adapter: 'Delivery Adapter', 'verification-contract': 'Verification Contract', receipt: 'Build Receipt',
      briefing: 'Product Briefing', specialists: 'Specialists', 'specialist-detail': 'Specialist view', history: 'History', gaps: 'Gaps', evidence: 'Evidence', efficiency: 'Efficiency', settings: 'Settings', 'project-details': 'Project details'
    };

    function safeRoute(route) {
      return routeTitles[route] ? route : 'home';
    }

    function activePrimary() {
      if (['checkpoint', 'revision', 'approval'].includes(state.route)) return 'product-room';
      if (['build-assignment', 'adapter', 'verification-contract', 'receipt'].includes(state.route)) return 'build';
      if (state.route === 'atlas-domain') return 'atlas';
      return state.route;
    }

    function status(label, kind = 'neutral') {
      return `<span class="status ${kind}">${label}</span>`;
    }

    function routeButton(label, route, style = 'btn', extra = '') {
      return `<button class="${style}" data-route="${route}" ${extra}>${label}</button>`;
    }

    function pageHead(eyebrow, title, body, actions = '') {
      return `<header class="page-head"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h1>${title}</h1><p class="lede">${body}</p></div>${actions ? `<div class="page-actions">${actions}</div>` : ''}</header>`;
    }

    function brand() {
      return `<div class="brand" data-route="home" role="button" tabindex="0" aria-label="Go to home"><div class="brand-mark">SL</div><div><strong>SpecLoops</strong><small>One world. Many perspectives.</small></div></div>`;
    }

    function shell(content) {
      const active = activePrimary();
      return `<div class="app-shell">
        <aside class="sidebar" aria-label="Primary navigation">
          ${brand()}
          <button class="project-switcher" data-route="project-details"><span>Current project</span><strong>${project.name}</strong></button>
          <nav class="nav-group">
            <div class="nav-label">Workspace</div>
            ${nav.map(([r, icon, label]) => `<button class="nav-item ${active === r ? 'active' : ''}" data-route="${r}"><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join('')}
          </nav>
          <nav class="nav-group">
            <div class="nav-label">Explore</div>
            ${moreNav.map(([r, label], i) => `<button class="nav-item ${state.route === r ? 'active' : ''}" data-route="${r}"><span class="nav-icon">${String(i + 1).padStart(2, '0')}</span><span>${label}</span></button>`).join('')}
          </nav>
          <div class="sidebar-foot">
            <div class="prototype-note"><strong>Interactive prototype</strong><br>All data is fictional.</div>
            <button class="btn btn-soft" data-action="save-pause">Save and pause</button>
          </div>
        </aside>
        <section class="workspace">
          <div class="mobile-top">${brand()}<div class="top-actions"><button class="btn btn-ghost btn-sm" data-action="toggle-help" aria-pressed="${state.helpEnabled}">Help ${state.helpEnabled?'on':'off'}</button>${themeButton()}</div></div>
          <header class="topbar">
            <div class="crumbs"><span>${project.name}</span><span>/</span><strong>${routeTitles[state.route]}</strong></div>
            <div class="top-actions">
              <button class="btn btn-ghost btn-sm" data-action="prototype-info">Prototype data</button>
              <button class="btn btn-ghost btn-sm" data-action="toggle-help" aria-pressed="${state.helpEnabled}">Help ${state.helpEnabled?'on':'off'}</button>
              ${themeButton()}
              <button class="btn btn-soft" data-action="save-pause">Save and pause</button>
            </div>
          </header>
          <main id="main" class="content page-enter">${content}</main>
        </section>
        <nav class="mobile-nav" aria-label="Mobile primary navigation">
          ${nav.slice(0, 4).map(([r, icon, label]) => `<button class="${active === r ? 'active' : ''}" data-route="${r}">${icon}<br>${label === 'Product Room' ? 'Room' : label}</button>`).join('')}
          <button data-action="mobile-more" class="${state.mobileMenu ? 'active' : ''}">•••<br>More</button>
        </nav>
        <div class="mobile-menu ${state.mobileMenu ? 'show' : ''}">
          ${[['briefing','Briefing'], ...moreNav].map(([r, label]) => `<button class="btn btn-ghost" data-route="${r}">${label}</button>`).join('')}
        </div>
      </div>`;
    }

    function homeScreen() {
      return `${pageHead('Project home', `Good morning, Maya.`, 'Here’s where Northstar Care stands, and where your attention will make a difference.', `${routeButton('Full briefing', 'briefing', 'btn')}`)}
        <div class="grid grid-asym">
          <section class="card tinted summary-card">
            <div class="card-head"><span class="label">Your project briefing</span>${status('Sample workspace','good')}</div>
            <h2>${state.decisionCaptured ? 'Your next draft is ready for review.' : 'One product choice brings your next draft into focus.'}</h2>
            <p>${state.decisionCaptured ? 'The recovery decision is recorded. Review the named revision before authorizing the next transition.' : 'Decide how patients recover access when a passkey isn’t available. That completes the product decisions for your next draft.'}</p>
            <p>${state.receiptOutcome === 'accepted' ? 'You accepted the returned build. The decision and supporting proof remain in History.' : state.receiptOutcome === 'correction' ? 'A correction request is recorded for the build. The assignment now needs revision.' : state.receiptAvailable ? 'Your coding agent returned work. One mobile consent difference needs your review.' : state.assignmentSent ? 'The assignment is with your coding agent. The prototype can simulate a returned receipt when you are ready.' : 'Your next build has not been sent. Product approval comes first.'}</p>
            <div class="summary-footer"><span><strong>${state.decisionCaptured ? '0' : '1'}</strong> product decision left</span><span><strong>${state.gapOutcome === 'review' ? '1' : '0'}</strong> UX review open</span><button class="btn btn-ghost btn-sm" data-action="attention-drawer">See what needs attention →</button></div>
          </section>
          <section class="card next-card">
            <span class="label">Recommended next</span>
            <h2>${nextAction().label}</h2>
            <p>${!state.decisionCaptured ? 'Compare three options, understand the trade-offs, and make one clear decision.' : !state.revisionApproved ? 'Read the exact named revision before granting approval.' : !state.assignmentSent ? 'Package the approved intent, boundaries, and required proof for your coding agent.' : !state.receiptAvailable ? 'The assignment is sent. Simulate the returned work to continue this prototype journey.' : state.receiptOutcome==='review' ? 'Inspect implementation, behavioral, and conformance proof before deciding.' : state.receiptOutcome==='correction' ? 'Refine the assignment around the failed mobile criterion.' : 'See how the accepted result changed the shared project model.'}</p>
            <small>Human authorization stays explicit at each consequential transition.</small>
            <button class="btn btn-primary" data-route="${nextAction().route}">${nextAction().label} →</button>
            <button class="btn btn-ghost btn-sm" data-action="attention-drawer">Other items needing attention</button>
          </section>
        </div>

        <div class="section-title"><h2>Current journey</h2><button class="btn btn-ghost btn-sm" data-route="campaigns">Manage campaigns</button></div>
        <section class="card">
          <div class="card-head"><div><span class="label">Primary campaign</span><h2>${project.primaryCampaign}</h2><p>${project.quest}</p></div>${status('Active', 'good')}</div>
          <div class="journey" aria-label="Campaign journey">
            <div class="journey-step done">Understand</div><div class="journey-step ${state.decisionCaptured?'done':'current'}">Decide</div><div class="journey-step ${state.decisionCaptured?'done':''}">Checkpoint</div><div class="journey-step ${state.revisionApproved?'done':state.decisionCaptured?'current':''}">Approve</div><div class="journey-step ${state.receiptOutcome==='accepted'?'done':state.revisionApproved?'current':''}">Build and verify</div>
          </div>
          <div class="grid grid-4" style="margin-top:18px">
            <div class="mini-metric"><span class="label">Decision readiness</span><strong>${state.decisionCaptured?'Decisions complete':'1 decision remains'}</strong></div>
            <div class="mini-metric"><span class="label">Checkpoint</span><strong>${state.decisionCaptured?'Ready for review':'Waiting for decision'}</strong></div>
            <div class="mini-metric"><span class="label">Authority</span><strong>Product Room only</strong></div>
            <div class="mini-metric"><span class="label">Recommended next</span><strong>${nextAction().label}</strong></div>
          </div>
        </section>

        <div class="section-title"><h2>Your project at a glance</h2><button class="btn btn-ghost btn-sm" data-route="atlas">Open full Atlas</button></div>
        <div class="grid grid-4">
          <div class="card clickable" data-action="open-domain" data-domain="Product"><span class="label">Product</span><div class="metric small">Healthy</div><p>18 canonical decisions, one open.</p></div>
          <div class="card warning clickable" data-action="open-domain" data-domain="User Experience"><span class="label">User Experience</span><div class="metric small">Attention</div><p>One mobile consent gap.</p></div>
          <div class="card clickable" data-action="open-domain" data-domain="Architecture"><span class="label">Architecture</span><div class="metric small">Healthy</div><p>Target state remains current.</p></div>
          <div class="card info clickable" data-action="open-domain" data-domain="Quality"><span class="label">Quality</span><div class="metric small">${state.receiptOutcome==='accepted'?'Verified':state.receiptAvailable?'Review':'Waiting'}</div><p>${state.receiptOutcome==='accepted'?'Returned proof accepted by the human reviewer.':state.receiptAvailable?'Returned proof needs human review.':'Proof requirements are defined before build.'}</p></div>
        </div>

        <div class="section-title"><h2>Recent change</h2><button class="btn btn-ghost btn-sm" data-route="history">View history</button></div>
        <div class="grid grid-2">
          <div class="card"><div class="card-head"><h3>Observed in repository</h3>${status('Evidence', 'info')}</div><p>Passkey enrollment now emits a recovery-code event. Verified against commit <strong>7f2c1ab</strong>.</p><button class="btn btn-sm" data-route="evidence">Inspect evidence</button></div>
          <div class="card"><div class="card-head"><h3>Briefing available</h3>${status('Today', 'good')}</div><p>Five specialist perspectives have been synthesized into one decision-ready update.</p><button class="btn btn-sm" data-route="briefing">Read briefing</button></div>
        </div>`;
    }

    function onboardingScreen() {
      return `<div class="wizard-shell">
        <aside class="wizard-aside">${brand()}<div><div class="eyebrow" style="color:#c9e0d2">Choose your path</div><h1>Bring a project into focus.</h1><p>Start fresh, reconstruct an existing world, or join a team with the right authority already attached.</p></div><p>Fictional prototype data. Nothing will be connected or changed.</p></aside>
        <main class="wizard-main"><div class="wizard-panel"><h2>How are you entering this project?</h2><p class="lede">This describes your relationship to the project. You will choose what you want to accomplish next.</p>
          <div class="choice-grid">
            <button class="choice" data-route="onboarding-start"><span class="choice-number">01</span><span><strong>Start New</strong><small>Shape an idea into a buildable first version.</small></span><span class="arrow">→</span></button>
            <button class="choice" data-route="onboarding-resume"><span class="choice-number">02</span><span><strong>Resume Existing</strong><small>Reconstruct current reality, then resolve what matters.</small></span><span class="arrow">→</span></button>
            <button class="choice" data-route="onboarding-invite"><span class="choice-number">03</span><span><strong>Invite or Join</strong><small>Enter a shared project with role and authority intact.</small></span><span class="arrow">→</span></button>
          </div><div class="wizard-nav"><button class="btn" data-route="home">Return home</button><button class="btn btn-ghost" data-action="prototype-info">How this prototype works</button></div>
        </div></main>
      </div>`;
    }

    function pathWizard(kind) {

    function enhanceHelp() {

        if (!helpCopy[key] || el.closest('[data-action], [data-route]') && el.tagName!=='BUTTON') return;
        const info = document.createElement('button');
        info.className='help-button'; info.dataset.action='context-help'; info.dataset.help=key;
        info.type='button'; info.setAttribute('aria-label','About '+el.textContent.trim()); info.setAttribute('aria-expanded','false');
        info.innerHTML='<span aria-hidden="true">i</span>';
        if (el.tagName==='BUTTON') {
          const wrap=document.createElement('span'); wrap.className='help-pair';
          el.replaceWith(wrap); wrap.append(el,info);
        } else el.append(' ',info);
      });
    }

    }

    function showCardDetail(card) {
      const title=card.querySelector('h2,h3,.label')?.textContent.trim() || 'Project context';
      const copy=card.cloneNode(true);copy.querySelectorAll('button,.help-button').forEach(x=>x.remove());
      openModal('generic',{title:escapeHtml(title),body:escapeHtml(copy.textContent.trim().replace(/\s+/g,' '))+'<br><br>This is fictional prototype context, not a live project observation.'});
    }

    function renderRoute() {
      switch (state.route) {
        case 'onboarding': return onboardingScreen();
        case 'onboarding-start': case 'onboarding-resume': case 'onboarding-invite': return pathWizard(state.route);
        case 'session-zero': return sessionZeroScreen();
        case 'home': return shell(homeScreen());
        case 'campaigns': return shell(campaignsScreen());
        case 'atlas': return shell(atlasScreen());
        case 'atlas-domain': return shell(atlasDomainScreen());
        case 'product-room': return shell(productRoomScreen());
        case 'checkpoint': return shell(checkpointScreen());
        case 'revision': return shell(revisionScreen());
        case 'approval': return shell(approvalScreen());
        case 'build': return shell(buildScreen());
        case 'build-assignment': return shell(buildAssignmentScreen());
        case 'adapter': return shell(adapterScreen());
        case 'verification-contract': return shell(verificationContractScreen());
        case 'receipt': return shell(receiptScreen());
        case 'briefing': return shell(briefingScreen());
        case 'specialists': return shell(specialistsScreen());
        case 'specialist-detail': return shell(specialistDetailScreen());
        case 'history': return shell(historyScreen());
        case 'gaps': return shell(gapsScreen());
        case 'evidence': return shell(evidenceScreen());
        case 'efficiency': return shell(efficiencyScreen());
        case 'settings': return shell(settingsScreen());
        case 'project-details': return shell(projectDetailsScreen());
        default: return shell(homeScreen());
      }
    }

    function render(options = {}) {
      closeHelp();
      const focus=document.activeElement;
      const focusAction=focus?.dataset?.action;
      const focusValue=focus?.dataset?.value;
      document.getElementById('app').innerHTML = renderRoute();
      if(state.route==='home' && state.paused){
        document.querySelector('#main').insertAdjacentHTML('afterbegin',`<section class="card info" style="margin-bottom:24px"><div class="setting-row"><div><h3>Your place is saved in this browser</h3><p>Resume at ${routeTitles[state.pauseRoute] || 'Home'}. This prototype does not check live sources.</p></div><button class="btn btn-primary" data-action="resume-prototype">Resume where I paused</button></div></section>`);
      }
      if(state.route==='settings'){
        document.querySelector('#main .page-head').insertAdjacentHTML('afterend',`<section class="card" style="margin-bottom:24px"><div class="setting-row"><div><h2>Contextual help</h2><p>Small information icons explain unfamiliar terms. Hover, focus, or tap to read.</p></div><button class="btn" data-action="toggle-help" aria-pressed="${state.helpEnabled}">Help ${state.helpEnabled?'on':'off'}</button></div></section><section class="card" style="margin-bottom:24px"><div class="setting-row"><div><h2>AI connections and spending</h2><p>See the sample services, token usage, estimated costs, and reporting gaps.</p></div><button class="btn" data-action="open-connections">Review connections</button></div></section>`);
      }
      document.getElementById('modal-root').innerHTML = state.modal ? modalMarkup(state.modal) : '';
      document.getElementById('app').inert=!!state.modal;
      document.body.style.overflow=state.modal?'hidden':'';
      document.querySelectorAll('#app .card:not([data-route]):not([data-action])').forEach(card=>{
        if(!card.querySelector('button,input,select,textarea,[data-route],[data-action],.card')){
          card.dataset.cardAction='inspect';card.classList.add('clickable');card.tabIndex=0;card.setAttribute('role','button');
        }
      });
      document.querySelectorAll('#app [data-route],#app [data-action]').forEach(el=>{
        if(el.tagName!=='BUTTON'&&el.tagName!=='A'){el.tabIndex=0;el.setAttribute('role','button');}
      });
      enhanceHelp();
      document.querySelectorAll('.tabs').forEach(group=>{
        group.setAttribute('role','group');
        group.querySelectorAll('.tab').forEach(tab=>tab.setAttribute('aria-pressed',tab.classList.contains('active')));
      });
      document.title = `${routeTitles[state.route]} - SpecLoops Prototype`;
      savePrototype();
      if(state.modal) document.querySelector('.modal [data-action="close-modal"]')?.focus({preventScroll:true});
      else if(focusAction){
        const candidate=[...document.querySelectorAll('[data-action]')].find(el=>el.dataset.action===focusAction&&el.dataset.value===focusValue&&el.getClientRects().length);
        candidate?.focus({preventScroll:true});
      }
      if (!options.keepScroll) window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function navigate(route, push = true) {
      state.previousRoute = state.route;
      state.route = safeRoute(route);
      state.modal=null;
      state.mobileMenu = false;
      const params=new URLSearchParams();
      if(state.route==='atlas-domain')params.set('domain',state.atlasDomain);
      if(state.route==='specialist-detail')params.set('role',state.specialist);
      const hash='#'+state.route+(params.size?'?'+params:'');
      if(push && location.hash!==hash)history.pushState(null,'',hash);
      render();
      document.querySelector('#main h1')?.setAttribute('tabindex','-1');
      document.querySelector('#main h1')?.focus({preventScroll:true});
    }

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
    }

    function openModal(type, payload = {}) {
      state.modal = { type, ...payload };
      render({ keepScroll: true });
    }

    function modalMarkup(modal) {
      const header=title=>`<div class="modal-head"><div><div class="eyebrow">${modal.type==='attention'?'Your attention':'Sample workspace'}</div><h2 id="dialog-title">${title}</h2></div><button class="btn icon-btn" data-action="close-modal" aria-label="Close dialog">×</button></div>`;
      let content='';
      if(modal.type==='attention')content=header('What needs you next')+attentionMarkup();
      else if(modal.type==='pause')content=header('Save your place and take a break.')+`<p>Save your choices, current screen, and review outcomes in this browser. You can resume from Home. No data is sent to a server.</p><div class="spec-block"><strong>Resume point</strong><p>${routeTitles[state.route]} in ${project.name}</p></div><div class="modal-actions"><button class="btn" data-action="close-modal">Keep working</button><button class="btn btn-primary" data-action="confirm-pause">Save and pause</button></div>`;
      else if(modal.type==='outcome'){
        const correction=modal.action==='correction',gap=modal.action==='gap';
        content=header(correction?'Request a specific correction':gap?'Accept this UX difference?':'Accept the returned work?')+`<p>${correction?'The existing receipt stays in History. Record exactly what should change; no correction is sent to an external builder in this prototype.':gap?'Record an explicit exception for mobile consent placement. This does not accept the entire build.':'You are accepting the sample build, including the visible mobile consent difference. Acceptance does not merge code or deploy.'}</p><div class="field"><label for="outcome-reason">Reason for your decision</label><textarea id="outcome-reason">${correction?'Keep the primary consent action beside the decision context at 390px and return updated mobile proof.':'The consent action remains visible and understandable; accept the placement difference with the linked evidence.'}</textarea><small id="outcome-error" role="alert"></small></div><div class="modal-actions"><button class="btn" data-action="close-modal">Keep review open</button><button class="btn btn-primary" data-action="confirm-outcome" data-value="${modal.action}">${correction?'Record correction request':'Confirm acceptance'}</button></div>`;
      } else if(modal.type==='evidence')content=header(escapeHtml(modal.title||'Evidence item'))+`<p>Fictional proof linked to the patient-onboarding example. This prototype illustrates the evidence record; it does not contain a live repository or test report.</p><div class="grid grid-2"><div class="spec-block"><strong>Source</strong><p>${escapeHtml(modal.title||'Sample source')}</p></div><div class="spec-block"><strong>Authority</strong><p>Evidence supports a decision; it does not authorize a transition.</p></div></div><button class="btn" data-action="close-modal">Done</button>`;
      else content=header(modal.title||'Project context')+(modal.type==='detail'?modal.body:`<p>${modal.body||'Fictional project context.'}</p><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Done</button></div>`);
      return `<div class="modal-backdrop ${modal.type==='attention'?'drawer-backdrop':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal ${modal.type==='attention'?'drawer':''}">${content}</div></div>`;
    }

    document.addEventListener('click', event => {
      const target=event.target.closest('[data-route], [data-action], [data-tab]');
      if(!target){
        const card=event.target.closest('[data-card-action]');
        if(card&&!event.target.closest('button,input,select,textarea,a'))showCardDetail(card);
        else if(!event.target.closest('#context-help'))closeHelp();
        return;
      }
      if(target.disabled)return;
      event.preventDefault();
      if(target.dataset.action==='context-help'){
        if(helpAnchor===target&&!document.getElementById('context-help').hidden){closeHelp();return;}
        showHelp(target);return;
      }
      closeHelp();
      if(target.dataset.route)return navigate(target.dataset.route);
      if(target.dataset.tab){
        const map={revision:'revisionTab',build:'buildTab',receipt:'receiptTab',atlas:'atlasTab',specialist:'specialistTab',history:'historyFilter',evidence:'evidenceFilter',efficiency:'efficiencyTab','usage-period':'usagePeriod'};
        if(map[target.dataset.tab])state[map[target.dataset.tab]]=target.dataset.value;
        render({keepScroll:true});
        [...document.querySelectorAll('[data-tab]')].find(el=>el.dataset.tab===target.dataset.tab&&el.dataset.value===target.dataset.value)?.focus({preventScroll:true});
        return;
      }
      const action=target.dataset.action,value=target.dataset.value;
      if(action==='toggle-theme'){state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;try{localStorage.setItem('sl-theme',state.theme);}catch{}render({keepScroll:true});}
      else if(action==='toggle-help'){state.helpEnabled=!state.helpEnabled;render({keepScroll:true});toast('Contextual help '+(state.helpEnabled?'on. Hover, focus, or tap an information icon.':'off. Turn it back on here or in Settings.'));}
      else if(action==='mobile-more'){state.mobileMenu=!state.mobileMenu;render({keepScroll:true});}
      else if(action==='attention-drawer')openModal('attention');
      else if(action==='domain-object')openDomainObject(value);
      else if(action==='save-pause')openModal('pause');
      else if(action==='close-modal'){state.modal=null;render({keepScroll:true});}
      else if(action==='confirm-pause'){
        state.modal=null;state.pauseRoute=state.route;state.paused=true;
        if(savePrototype()){navigate('home');toast('Saved in this browser. Resume from Home.');}
        else{state.paused=false;render({keepScroll:true});toast('Browser storage is unavailable. Keep this tab open to preserve your session.');}
      }
      else if(action==='resume-prototype'){state.paused=false;navigate(state.pauseRoute||'home');toast('Prototype state restored. No live sources were checked.');}
      else if(action==='prototype-info')openModal('generic',{title:'Fictional sample workspace',body:'All people, metrics, repositories, models, and connections are invented. The draft journey and returned-build review are separate examples. Nothing is connected, sent, billed, or deployed.'});
      else if(action==='session-choice'){state.sessionChoice=value;render({keepScroll:true});}
      else if(action==='wizard-next'){state.wizardStep=Math.min(3,state.wizardStep+1);render();}
      else if(action==='wizard-back'){state.wizardStep=Math.max(0,state.wizardStep-1);render();}
      else if(action==='select-campaign'){state.themeChoice=value;render({keepScroll:true});toast('Primary campaign updated in the sample workspace.');}
      else if(action==='toggle-secondary'){state.secondaryCampaigns=state.secondaryCampaigns.includes(value)?state.secondaryCampaigns.filter(x=>x!==value):[...state.secondaryCampaigns,value];render({keepScroll:true});}
      else if(action==='open-domain'){state.atlasDomain=target.dataset.domain||'Product';state.atlasTab='map';navigate('atlas-domain');}
      else if(action==='decision-choice'){if(state.decisionChoice!==value){state.decisionCaptured=false;state.revisionApproved=false;state.assignmentSent=false;}state.decisionChoice=value;render({keepScroll:true});}
      else if(action==='capture-decision'){if(!state.decisionChoice)return;state.decisionCaptured=true;recordActivity('Recovery decision captured',decisionLabel());render({keepScroll:true});toast('Decision captured in this prototype.');}
      else if(action==='ask-why')openModal('generic',{title:'Why this choice matters',body:'Email recovery depends on mailbox access. Printed codes work offline but must be kept safe. Care-team assistance needs a trusted verification process. Your choice changes the requirements and proof expected from the builder.'});
      else if(action==='finish-checkpoint'){state.checkpointState='ready';render({keepScroll:true});toast('Named draft checkpoint verified in the sample.');}
      else if(action==='request-change'){state.revisionTab='changes';render({keepScroll:true});toast('Review the changes, or return to Product Room to change the recovery decision.');}
      else if(action==='approve-revision'){
        if(!state.decisionCaptured){navigate('product-room');toast('Resolve the product decision before approving this draft.');return;}
        state.revisionApproved=true;recordActivity('Exact revision approved',project.revision+' approved by '+project.owner+'. No code execution authorized.');navigate('approval');
      }
      else if(action==='publish-assignment'){
        if(!state.revisionApproved){navigate('revision');toast('Review and approve the exact revision first.');return;}
        state.assignmentSent=true;recordActivity('Sample assignment published','Simulated delivery through '+adapterName()+'. No external work was sent.','build');render({keepScroll:true});toast('Assignment sent in the simulation only.');
      }
      else if(action==='simulate-return'){
        if(!state.assignmentSent)return;
        state.receiptAvailable=true;state.receiptOutcome='review';state.gapOutcome='review';
        recordActivity('Build Receipt BR-014 returned','The coding-agent simulation returned implementation, behavioral, and conformance proof. AC-017 needs human review.','evidence');
        navigate('receipt');toast('Returned work added to the prototype. Review the proof before deciding.');
      }
      else if(action==='republish-correction'){
        state.receiptOutcome='review';state.gapOutcome='review';state.receiptAvailable=false;state.assignmentSent=true;
        recordActivity('Corrected assignment published','AC-017 now requires the primary consent action beside the decision context at 390px. No external work was sent.','build');
        navigate('build');toast('Corrected assignment sent in the simulation.');
      }
      else if(action==='select-adapter'){state.adapter=value;render({keepScroll:true});toast('Delivery adapter selected for the sample.');}
      else if(action==='open-specialist'){state.specialist=value;state.specialistTab='brief';navigate('specialist-detail');}
      else if(action==='evidence-detail')openModal('evidence',{title:target.dataset.title});
      else if(action==='accept-build')openModal('outcome',{action:'accept'});
      else if(action==='return-build')openModal('outcome',{action:'correction'});
      else if(action==='accept-gap')openModal('outcome',{action:'gap'});
      else if(action==='confirm-outcome'){
        const reason=document.getElementById('outcome-reason').value.trim();
        if(reason.length<8){document.getElementById('outcome-error').textContent='Add a short reason so the decision can be understood later.';return;}
        if(value==='correction'){state.receiptOutcome='correction';state.gapOutcome='correction';}
        else if(value==='gap')state.gapOutcome='accepted';
        else{state.receiptOutcome='accepted';state.gapOutcome='accepted';}
        recordActivity(value==='correction'?'Correction requested for BR-014':value==='gap'?'Mobile consent difference accepted':'Build Receipt BR-014 accepted',reason,value==='gap'?'decisions':'build');
        state.modal=null;render({keepScroll:true});toast('Decision recorded in History. No external action was taken.');
      }
      else if(action==='open-connections'){state.efficiencyTab='connections';navigate('efficiency');}
      else if(action==='usage-detail'){
        const r=sampleUsage[state.usagePeriod][Number(value)];
        openModal('generic',{title:r[0]+' · sample usage',body:`${r[1]}. ${number(r[2])} input tokens, including ${number(r[3])} cached input, and ${number(r[4])} output tokens. Illustrative usage charge: ${money(r[5])}. No live account or current vendor pricing is used. Reporting window: ${state.usagePeriod==='week'?'last 7 days':'this month'}.`});
      }
      else if(action==='connection-detail')openModal('generic',{title:escapeHtml(value)+' · sample connection',body:value==='External coding agent'?'Builder execution is outside this prototype. Usage has not been reported; cost is unknown, not zero. In a live project, the builder would need to supply usage or authorize a scoped connector.':value==='GitHub'?'Workflow-only example: carries assignments and receipt links. It does not report model tokens or GitHub subscription fees. No repository is actually connected.':'Illustrative connection only. Usage is fictional, no credentials are stored, and no account has been connected. Live connection would require separate authorization.'});
      else if(action==='budget-detail')openModal('generic',{title:'Budget alerts, not spending authority',body:'Example: alert the project owner at 80% of a $40 monthly AI budget. A notification is not a provider-side hard cap, and it cannot authorize more spending. All values here are fictional.'});
      else if(action==='export-usage'){
        const rows=sampleUsage[state.usagePeriod];
        const csv=['Fictional SpecLoops usage - not a bill','Provider,Model,Input tokens,Cached input subset,Output tokens,Estimated USD',...rows.map(r=>r.join(','))].join('\n');
        const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');
        link.href=url;link.download='specloops-sample-usage-'+state.usagePeriod+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Fictional usage CSV downloaded.');
      }
      else if(action==='share-briefing')openModal('generic',{title:'Briefing share preview',body:'In a live workspace, this would share a permission-aware briefing with its evidence links. No public link is created by this local prototype.'});
      else if(action==='save-settings')toast('Sample settings acknowledged. No external configuration changed.');
      else if(action==='person-detail')openModal('generic',{title:'Authority details',body:'Role defines the lane. Object-level authority defines the action. Sensitive transitions remain explicitly gated.'});
      else if(action==='invite-person')openModal('generic',{title:'Invite collaborator',body:'A live invitation would bind a project role and authority before sending. No invitation is sent in this sample.'});
      else if(action==='gap-info')openModal('generic',{title:'Review context',body:'A stale runtime snapshot must be refreshed after an authorized deployment. Microsoft SSO is deferred outside this MVP. Neither is silently treated as verified.'});
    });

    document.addEventListener('pointerover',event=>{
      const button=event.target.closest('.help-button');if(button&&event.pointerType!=='touch')showHelp(button);
    });
    document.addEventListener('pointerout',event=>{
      if(event.target.closest('.help-button')&&!event.relatedTarget?.closest('.help-button,#context-help'))closeHelp();
    });
    document.addEventListener('focusin',event=>{if(event.target.matches('.help-button'))showHelp(event.target);});
    document.addEventListener('focusout',event=>{if(event.target.matches('.help-button')&&!event.relatedTarget?.closest('#context-help'))closeHelp();});
    window.addEventListener('resize',closeHelp);
    window.addEventListener('scroll',closeHelp,true);
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){
        closeHelp();
        if(state.modal){state.modal=null;render({keepScroll:true});}
        return;
      }
      if(event.key==='Tab'&&state.modal){
        const nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal textarea,.modal select')].filter(el=>el.getClientRects().length);
        if(nodes.length&&event.shiftKey&&document.activeElement===nodes[0]){event.preventDefault();nodes.at(-1).focus();}
        else if(nodes.length&&!event.shiftKey&&document.activeElement===nodes.at(-1)){event.preventDefault();nodes[0].focus();}
      }
      if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"]:not(button)')){
        event.preventDefault();event.target.click();
      }
    });

    try{
      const saved=JSON.parse(localStorage.getItem('sl-feedback-v2')||'null');
      if(saved)Object.keys(state).forEach(key=>{if(key!=='modal'&&saved[key]!==undefined)state[key]=saved[key];});
      if(saved?.paused){state.paused=true;state.pauseRoute=saved.pauseRoute;}
    }catch{}
    function readHash(){
      const [route,query='']=location.hash.slice(1).split('?');
      const params=new URLSearchParams(query);
      if(routeTitles[route])state.route=route;
      if(domainModels[params.get('domain')])state.atlasDomain=params.get('domain');
      if(roles.some(r=>r[0]===params.get('role')))state.specialist=params.get('role');
      state.modal=null;render();
    }
    window.addEventListener('popstate',readHash);
    window.addEventListener('hashchange',readHash);
    document.documentElement.dataset.theme=state.theme;
    readHash();
  </script>
</body>
</html>
